name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Code Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Go unit tests
        run: go test -v -short ./...

      - name: Run frontend TypeScript type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Check Go code formatting
        run: |
          go fmt ./...
          git diff --exit-code || (echo "Go code is not formatted. Please run 'go fmt ./...' and commit changes."; exit 1)

  generated-code-check:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install Hz and Kitex
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.0
          go install github.com/cloudwego/hertz/cmd/hz@v0.9.7
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.15.4
          protoc-gen-go --version
          hz --version
          kitex --version || true

      - name: Check generated code is in sync
        run: make check-generated
