name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests & Code Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare embed directory
        run: |
          mkdir -p pkg/embed/public
          touch pkg/embed/public/.gitkeep
          mkdir -p pkg/embed/docs
          touch pkg/embed/docs/.gitkeep

      - name: Run Go unit tests
        run: |
          go list ./... | grep -v '/tests/integration$' | grep -v 'cmd/desktop' | grep -v 'cmd/server' | grep -v '/frontend/dist' | grep -v 'pkg/embed' | xargs go test -v -short

      - name: Run frontend TypeScript type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Check Go code formatting
        run: |
          go fmt ./...
          git diff --exit-code -- '*.go' || (echo "Go code is not formatted. Please run 'go fmt ./...' and commit changes."; exit 1)

  generated-code-check:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install protoc
        run: |
          # Pinned to v35.1 — the version the committed .pb.go files were
          # generated with. The generated descriptors embed the protoc
          # version, so any other version produces drift in check-generated.
          PB_VER=35.1
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VER}/protoc-${PB_VER}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Install Hz and Kitex
        run: |
          # Tool versions must match those used to generate the committed
          # code (see the headers in biz/kitex_gen and biz/model/*.pb.go).
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.0
          go install github.com/cloudwego/hertz/cmd/hz@v0.9.7
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.3
          protoc-gen-go --version
          hz --version
          kitex --version || true

      - name: Check generated code is in sync
        run: make check-generated
