// idl/biz/spec.proto - Spec 相关 API 定义
syntax = "proto2";

package spec;

import "api.proto";
import "common.proto";

option go_package = "/spec";

// Spec 服务
service SpecService {
    // 文件操作 API
    rpc GetSpecTree(common.EmptyRequest) returns (SpecTreeResponse) {
        option (api.get) = "/api/v1/spec/tree";
    }
    
    rpc ListSpecFiles(common.EmptyRequest) returns (SpecFileListResponse) {
        option (api.get) = "/api/v1/spec/list";
    }
    
    rpc GetSpecContent(SpecContentRequest) returns (SpecContentResponse) {
        option (api.get) = "/api/v1/spec/content";
    }
    
    rpc GetSpecContentByPath(SpecContentByPathRequest) returns (SpecContentResponse) {
        option (api.get) = "/api/v1/spec/content/:path";
    }
    
    rpc SaveSpecContent(SaveSpecContentRequest) returns (common.EmptyResponse) {
        option (api.post) = "/api/v1/spec/save";
    }
    
    rpc SaveSpecContentByPath(SaveSpecContentByPathRequest) returns (common.EmptyResponse) {
        option (api.put) = "/api/v1/spec/content/:path";
    }
    
    // Linting API
    rpc LintSpec(LintRequest) returns (LintResponse) {
        option (api.post) = "/api/v1/spec/lint";
    }
    
    rpc GetLintRules(common.EmptyRequest) returns (LintRuleListResponse) {
        option (api.get) = "/api/v1/spec/rules";
    }
    
    rpc UpdateLintRule(UpdateLintRuleRequest) returns (LintRuleResponse) {
        option (api.put) = "/api/v1/spec/rules/:id";
    }
    
    rpc CreateLintRule(CreateLintRuleRequest) returns (LintRuleResponse) {
        option (api.post) = "/api/v1/spec/rules";
    }
    
    // Git 操作 API
    rpc CommitSpec(CommitSpecRequest) returns (common.EmptyResponse) {
        option (api.post) = "/api/v1/spec/commit/:path";
    }
    
    // 兼容旧 API
    rpc ValidateSpec(ValidateSpecRequest) returns (ValidateSpecResponse) {
        option (api.post) = "/api/v1/spec/validate";
    }
    
    rpc CreateSpecFile(CreateSpecFileRequest) returns (common.EmptyResponse) {
        option (api.post) = "/api/v1/spec/create";
    }
    
    rpc DeleteSpecFile(DeleteSpecFileRequest) returns (common.EmptyResponse) {
        option (api.post) = "/api/v1/spec/delete";
    }

    // AI 相关 API
    rpc AIAssistSpec(AIAssistRequest) returns (AIAssistResponse) {
        option (api.post) = "/api/v1/spec/ai-assist";
    }

    rpc AIFixSpec(AIFixRequest) returns (AIFixResponse) {
        option (api.post) = "/api/v1/spec/ai-fix";
    }

    // 格式化 API
    rpc FormatSpec(FormatSpecRequest) returns (FormatSpecResponse) {
        option (api.post) = "/api/v1/spec/format";
    }

    // 配置 API
    rpc GetSpecConfig(GetSpecConfigRequest) returns (SpecConfigResponse) {
        option (api.get) = "/api/v1/spec/config";
    }

    rpc SaveSpecConfig(SaveSpecConfigRequest) returns (SpecConfigResponse) {
        option (api.put) = "/api/v1/spec/config";
    }
}

// Spec 树响应
message SpecTreeResponse {
    optional common.BaseResponse base = 1;
    repeated SpecFile files = 2;
}

// Spec 文件列表响应
message SpecFileListResponse {
    optional common.BaseResponse base = 1;
    repeated SpecFile files = 2;
}

// Spec 文件信息
message SpecFile {
    optional string name = 1;
    optional string path = 2;
    optional bool is_dir = 3;
    optional int64 size = 4;
    optional string mod_time = 5;
    repeated SpecFile children = 6;
}

// Spec 内容请求
message SpecContentRequest {
    optional string repo_key = 1 [(api.query) = "repo_key"];
    optional string path = 2 [(api.query) = "path"];
}

// Spec 内容按路径请求
message SpecContentByPathRequest {
    optional string repo_key = 1 [(api.query) = "repo_key"];
    optional string path = 2 [(api.path) = "path"];
}

// Spec 内容响应
message SpecContentResponse {
    optional common.BaseResponse base = 1;
    optional string content = 2;
    optional string path = 3;
}

// 保存 Spec 内容请求
message SaveSpecContentRequest {
    optional string repo_key = 1;
    optional string path = 2;
    optional string content = 3;
    optional string commit_message = 4;
}

// 保存 Spec 内容按路径请求
message SaveSpecContentByPathRequest {
    optional string repo_key = 1;
    optional string path = 2 [(api.path) = "path"];
    optional string content = 3;
    optional string message = 4;
    optional bool auto_commit = 5;
}

// Lint 请求
message LintRequest {
    optional string content = 1;
    repeated string rules = 2;
    optional string mode = 3;
}

// Lint 响应
message LintResponse {
    optional common.BaseResponse base = 1;
    optional string file = 2;
    repeated LintIssue issues = 3;
    optional LintStats stats = 4;
}

// Lint 问题
message LintIssue {
    optional string rule_id = 1;
    optional string severity = 2;
    optional string message = 3;
    optional int32 line = 4;
    optional int32 column = 5;
    optional int32 end_line = 6;
    optional int32 end_column = 7;
    optional string source = 8;
    optional string quick_fix = 9;
}

// Lint 统计
message LintStats {
    optional int32 error_count = 1;
    optional int32 warning_count = 2;
    optional int32 info_count = 3;
}

// Lint 规则列表响应
message LintRuleListResponse {
    optional common.BaseResponse base = 1;
    repeated LintRule rules = 2;
}

// Lint 规则
message LintRule {
    optional string id = 1;
    optional string name = 2;
    optional string description = 3;
    optional string category = 4;
    optional string severity = 5;
    optional string pattern = 6;
    optional bool enabled = 7;
    optional int32 priority = 8;
    optional string created_at = 9;
    optional string updated_at = 10;
}

// 更新 Lint 规则请求
message UpdateLintRuleRequest {
    optional string id = 1 [(api.path) = "id"];
    optional string name = 2;
    optional string description = 3;
    optional string category = 4;
    optional string severity = 5;
    optional string pattern = 6;
    optional bool enabled = 7;
    optional int32 priority = 8;
}

// 创建 Lint 规则请求
message CreateLintRuleRequest {
    optional string id = 1;
    optional string name = 2;
    optional string description = 3;
    optional string category = 4;
    optional string severity = 5;
    optional string pattern = 6;
    optional bool enabled = 7;
    optional int32 priority = 8;
}

// Lint 规则响应
message LintRuleResponse {
    optional common.BaseResponse base = 1;
    optional LintRule rule = 2;
}

// 提交 Spec 请求
message CommitSpecRequest {
    optional string repo_key = 1;
    optional string path = 2 [(api.path) = "path"];
    optional string message = 3;
    optional string content = 4;
}

// 验证 Spec 请求
message ValidateSpecRequest {
    optional string content = 1;
}

// 验证 Spec 响应
message ValidateSpecResponse {
    optional common.BaseResponse base = 1;
    optional bool valid = 2;
    repeated LintIssue issues = 3;
    repeated LintIssue warnings = 4;
    optional ValidateStats stats = 5;
}

// 验证统计
message ValidateStats {
    optional string errors = 1;
    optional string total_lines = 2;
    optional string warnings = 3;
}

// 创建 Spec 文件请求
message CreateSpecFileRequest {
    optional string repo_key = 1;
    optional string path = 2;
    optional string name = 3;
    optional string content = 4;
}

// 删除 Spec 文件请求
message DeleteSpecFileRequest {
    optional string repo_key = 1;
    optional string path = 2;
    optional string commit_message = 3;
}

// AI 聊天消息
message ChatMessage {
    optional string role = 1;
    optional string content = 2;
}

// AI 辅助请求
message AIAssistRequest {
    optional string content = 1;
    optional string prompt = 2;
    optional string action = 3;
    repeated ChatMessage history = 4;
}

// AI 辅助响应
message AIAssistResponse {
    optional common.BaseResponse base = 1;
    optional string result = 2;
    optional string apply_content = 3;
}

// AI 修复请求
message AIFixRequest {
    optional string content = 1;
    optional string issue = 2;
    optional int32 line = 3;
    optional string severity = 4;
}

// AI 修复响应
message AIFixResponse {
    optional common.BaseResponse base = 1;
    optional string content = 2;
}

// 格式化请求
message FormatSpecRequest {
    optional string content = 1;
    optional bool curlify = 2 [default = true];
    optional bool remove_clean = 3 [default = true];
    optional bool remove_build_root = 4 [default = true];
    optional bool remove_group = 5 [default = false];
    optional bool license_spdx = 6 [default = true];
    optional bool sort_deps = 7 [default = true];
    optional bool tab_to_spaces = 8 [default = true];
    optional int32 indent_size = 9 [default = 4];
    optional bool preamble_order = 10 [default = true];
    optional bool align_values = 11 [default = true];
    optional bool path_macros = 12 [default = true];
    optional bool util_macros = 13 [default = true];
    optional bool common_cleanup = 14 [default = true];
    optional bool conditional_trim = 15 [default = true];
}

// 格式化变更
message FormatChange {
    optional int32 line = 1;
    optional string type = 2;
    optional string before = 3;
    optional string after = 4;
    optional string reason = 5;
}

// 格式化响应
message FormatSpecResponse {
    optional common.BaseResponse base = 1;
    optional string content = 2;
    repeated FormatChange changes = 3;
}

// Spec 配置请求
message GetSpecConfigRequest {}

message SpecFormatOptionsConfig {
    optional bool curlify = 1;
    optional bool remove_clean = 2;
    optional bool remove_build_root = 3;
    optional bool remove_group = 4;
    optional bool license_spdx = 5;
    optional bool sort_deps = 6;
    optional bool tab_to_spaces = 7;
    optional int32 indent_size = 8;
    optional bool preamble_order = 9;
    optional bool align_values = 10;
    optional bool path_macros = 11;
    optional bool util_macros = 12;
    optional bool common_cleanup = 13;
    optional bool conditional_trim = 14;
}

message SpecAIConfig {
    optional string default_action = 1;
    optional string system_prompt = 2;
    optional bool auto_fix = 3;
}

message SpecConfigResponse {
    optional common.BaseResponse base = 1;
    optional string default_template = 2;
    optional SpecFormatOptionsConfig format_options = 3;
    optional SpecAIConfig ai_config = 4;
}

message SaveSpecConfigRequest {
    optional string default_template = 1;
    optional SpecFormatOptionsConfig format_options = 2;
    optional SpecAIConfig ai_config = 3;
}
