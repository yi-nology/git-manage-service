// idl/biz/repo.proto - 仓库管理模块
syntax = "proto3";

package repo;

option go_package = "repo";

import "api.proto";
import "common.proto";

// RepoService 仓库管理服务
service RepoService {
  // List 获取仓库列表
  rpc List(ListRepoRequest) returns (ListRepoResponse) {
    option (api.get) = "/api/v1/repo/list";
  }
  
  // Get 获取仓库详情
  rpc Get(GetRepoRequest) returns (RepoResponse) {
    option (api.get) = "/api/v1/repo/detail";
  }
  
  // Create 注册仓库
  rpc Create(CreateRepoRequest) returns (RepoResponse) {
    option (api.post) = "/api/v1/repo/create";
  }
  
  // Update 更新仓库
  rpc Update(UpdateRepoRequest) returns (RepoResponse) {
    option (api.post) = "/api/v1/repo/update";
  }
  
  // Delete 删除仓库
  rpc Delete(DeleteRepoRequest) returns (common.EmptyResponse) {
    option (api.post) = "/api/v1/repo/delete";
  }
  
  // Scan 扫描本地仓库
  rpc Scan(ScanRepoRequest) returns (ScanRepoResponse) {
    option (api.post) = "/api/v1/repo/scan";
  }
  
  // Clone 克隆远程仓库
  rpc Clone(CloneRepoRequest) returns (CloneRepoResponse) {
    option (api.post) = "/api/v1/repo/clone";
  }
  
  // Fetch 拉取远程更新
  rpc Fetch(FetchRepoRequest) returns (common.EmptyResponse) {
    option (api.post) = "/api/v1/repo/fetch";
  }
  
  // GetCloneTask 获取克隆任务状态
  rpc GetCloneTask(GetCloneTaskRequest) returns (CloneTaskResponse) {
    option (api.get) = "/api/v1/repo/task";
  }
  
  // ScanDirectory 扫描目录
  rpc ScanDirectory(ScanDirectoryRequest) returns (ScanDirectoryResponse) {
    option (api.post) = "/api/v1/repo/scan-directory";
  }
  
  // BatchCreate 批量创建仓库
  rpc BatchCreate(BatchCreateRequest) returns (BatchCreateResponse) {
    option (api.post) = "/api/v1/repo/batch-create";
  }
}

// ScanDirectoryRequest 扫描目录请求
message ScanDirectoryRequest {
  string path = 1 [(api.body) = "path"];
}

// ScanDirectoryResponse 扫描目录响应
message ScanDirectoryResponse {
  common.BaseResponse base = 1;
  repeated Repo repos = 2;
}

// BatchCreateRequest 批量创建仓库请求
message BatchCreateRequest {
  repeated CreateRepoRequest repos = 1 [(api.body) = "repos"];
}

// BatchCreateResponse 批量创建仓库响应
message BatchCreateResponse {
  common.BaseResponse base = 1;
  int32 successCount = 2;
  int32 failureCount = 3;
}

// Repo 仓库实体
message Repo {
  int64 id = 1;
  string key = 2;
  string name = 3;
  string path = 4;
  string remoteUrl = 5;
  string status = 6;
  string authType = 7;
  string configSource = 8;
  repeated Remote remotes = 9;
  string createdAt = 10;
  string updatedAt = 11;
}

// Remote 远程仓库配置
message Remote {
  string name = 1;
  string fetchUrl = 2;
  string pushUrl = 3;
  bool isMirror = 4;
}

// AuthInfo 认证信息
message AuthInfo {
  string authType = 1;
  string authKey = 2;
  string authSecret = 3;
}

// ListRepoRequest 列表请求
message ListRepoRequest {
  int32 page = 1 [(api.query) = "page"];
  int32 pageSize = 2 [(api.query) = "pageSize"];
}

// ListRepoResponse 列表响应
message ListRepoResponse {
  common.BaseResponse base = 1;
  repeated Repo repos = 2;
  common.PaginationMeta pagination = 3;
}

// GetRepoRequest 获取仓库请求
message GetRepoRequest {
  string key = 1 [(api.query) = "key"];
}

// RepoResponse 仓库响应
message RepoResponse {
  common.BaseResponse base = 1;
  Repo repo = 2;
}

// CreateRepoRequest 创建仓库请求
message CreateRepoRequest {
  string name = 1 [(api.body) = "name"];
  string path = 2 [(api.body) = "path"];
  string remoteUrl = 3 [(api.body) = "remoteUrl"];
  string authType = 4 [(api.body) = "authType"];
  string authKey = 5 [(api.body) = "authKey"];
  string authSecret = 6 [(api.body) = "authSecret"];
  string configSource = 7 [(api.body) = "configSource"];
  repeated Remote remotes = 8 [(api.body) = "remotes"];
  map<string, AuthInfo> remoteAuths = 9 [(api.body) = "remoteAuths"];
}

// UpdateRepoRequest 更新仓库请求
message UpdateRepoRequest {
  string key = 1 [(api.body) = "key"];
  string name = 2 [(api.body) = "name"];
  string path = 3 [(api.body) = "path"];
  string remoteUrl = 4 [(api.body) = "remoteUrl"];
  string authType = 5 [(api.body) = "authType"];
  string authKey = 6 [(api.body) = "authKey"];
  string authSecret = 7 [(api.body) = "authSecret"];
  string configSource = 8 [(api.body) = "configSource"];
  repeated Remote remotes = 9 [(api.body) = "remotes"];
  map<string, AuthInfo> remoteAuths = 10 [(api.body) = "remoteAuths"];
}

// DeleteRepoRequest 删除仓库请求
message DeleteRepoRequest {
  string key = 1 [(api.body) = "key"];
}

// ScanRepoRequest 扫描仓库请求
message ScanRepoRequest {
  string path = 1 [(api.body) = "path"];
}

// ScanRepoResponse 扫描仓库响应
message ScanRepoResponse {
  common.BaseResponse base = 1;
  string name = 2;
  string path = 3;
  string headBranch = 4;
  repeated Remote remotes = 5;
  repeated string branches = 6;
}

// CloneRepoRequest 克隆仓库请求
message CloneRepoRequest {
  string remoteUrl = 1 [(api.body) = "remoteUrl"];
  string localPath = 2 [(api.body) = "localPath"];
  string authType = 3 [(api.body) = "authType"];
  string authKey = 4 [(api.body) = "authKey"];
  string authSecret = 5 [(api.body) = "authSecret"];
  string configSource = 6 [(api.body) = "configSource"];
}

// CloneRepoResponse 克隆仓库响应
message CloneRepoResponse {
  common.BaseResponse base = 1;
  string taskId = 2;
}

// FetchRepoRequest 拉取远程请求
message FetchRepoRequest {
  string key = 1 [(api.body) = "key"];
}

// GetCloneTaskRequest 获取克隆任务请求
message GetCloneTaskRequest {
  string taskId = 1 [(api.query) = "taskId"];
}

// CloneTask 克隆任务
message CloneTask {
  string id = 1;
  string status = 2;
  string error = 3;
  repeated string logs = 4;
}

// ScannedRepo 扫描到的仓库
message ScannedRepo {
  string name = 1;
  string path = 2;
  repeated Remote remotes = 3;
  string currentBranch = 4;
  string lastCommit = 5;
  bool hasChanges = 6;
}

// BatchFailedItem 批量失败项
message BatchFailedItem {
  string name = 1;
  string path = 2;
  string reason = 3;
}

// RepoDTO 仓库DTO
message RepoDTO {
  uint64 id = 1;
  string key = 2;
  string name = 3;
  string path = 4;
  string remoteUrl = 5;
  string authType = 6;
  string authKey = 7;
  string authSecret = 8;
  map<string, AuthInfo> remoteAuths = 9;
  uint64 defaultCredentialId = 10;
  map<string, uint64> remoteCredentials = 11;
  uint64 providerConfigId = 12;
  string platformRepoId = 13;
  string platformOwner = 14;
  string platformRepo = 15;
  string createdAt = 16;
  string updatedAt = 17;
}

// CloneTaskResponse 克隆任务响应
message CloneTaskResponse {
  common.BaseResponse base = 1;
  CloneTask task = 2;
}
