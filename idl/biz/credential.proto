// idl/biz/credential.proto - 凭证管理模块
syntax = "proto3";

package credential;

option go_package = "credential";

import "api.proto";
import "common.proto";

message CredentialInfo {
  uint64 id = 1;
  string name = 2;
  string type = 3;
  string description = 4;
  uint64 ssh_key_id = 5;
  string ssh_key_path = 6;
  string ssh_key_name = 7;
  string ssh_key_type = 8;
  string username = 9;
  bool has_secret = 10;
  string url_pattern = 11;
  string status = 12;
  string last_used_at = 13;
  string last_tested_at = 14;
  bool last_test_ok = 15;
  string last_error = 16;
  string rotated_at = 17;
  string expires_at = 18;
  string created_at = 19;
  string updated_at = 20;
}

message ListCredentialsRequest {
  string purpose = 1 [(api.query) = "purpose"];   // git_remote / platform_api
  string type = 2 [(api.query) = "type"];         // ssh_key / http_basic / http_token / platform_token
  string status = 3 [(api.query) = "status"];     // active / invalid / expiring / expired / disabled
  string keyword = 4 [(api.query) = "keyword"];   // 搜索关键词
}

message CredentialRepoUsage {
  uint64 repo_id = 1;
  string repo_name = 2;
  string repo_key = 3;
  bool is_default = 4;
  string remote_name = 5;
}

message CredentialProviderUsage {
  uint64 provider_id = 1;
  string provider_name = 2;
  string platform = 3;
}

message GetCredentialUsagesResponse {
  common.BaseResponse base = 1;
  repeated CredentialRepoUsage repos = 2;
  repeated CredentialProviderUsage providers = 3;
  int32 total_repo_count = 4;
  int32 total_provider_count = 5;
}

message RotateCredentialRequest {
  uint64 id = 1 [(api.path) = "id"];
  string new_secret = 2 [(api.body) = "new_secret"];
  string test_url = 3 [(api.body) = "test_url"];
}

message CreateCredentialRequest {
  string name = 1 [(api.body) = "name"];
  string type = 2 [(api.body) = "type"];
  string description = 3 [(api.body) = "description"];
  uint64 ssh_key_id = 4 [(api.body) = "ssh_key_id"];
  string ssh_key_path = 5 [(api.body) = "ssh_key_path"];
  string username = 6 [(api.body) = "username"];
  string secret = 7 [(api.body) = "secret"];
  string url_pattern = 8 [(api.body) = "url_pattern"];
}

message UpdateCredentialRequest {
  uint64 id = 1 [(api.path) = "id"];
  string name = 2 [(api.body) = "name"];
  string description = 3 [(api.body) = "description"];
  uint64 ssh_key_id = 4 [(api.body) = "ssh_key_id"];
  string ssh_key_path = 5 [(api.body) = "ssh_key_path"];
  string username = 6 [(api.body) = "username"];
  string secret = 7 [(api.body) = "secret"];
  string url_pattern = 8 [(api.body) = "url_pattern"];
}

message GetCredentialRequest {
  uint64 id = 1 [(api.path) = "id"];
}

message DeleteCredentialRequest {
  uint64 id = 1 [(api.path) = "id"];
}

message TestCredentialRequest {
  uint64 id = 1 [(api.path) = "id"];
  string url = 2 [(api.body) = "url"];
}

message TestCredentialResponse {
  common.BaseResponse base = 1;
  bool success = 2;
  string message = 3;
}

message MatchCredentialRequest {
  string url = 1 [(api.body) = "url"];
}

message CredentialUsage {
  repeated CredentialRepoUsage repos = 1;
  repeated CredentialProviderUsage providers = 2;
  int32 total_repo_count = 3;
  int32 total_provider_count = 4;
}

message MatchCredentialResponse {
  common.BaseResponse base = 1;
  repeated CredentialInfo recommended = 2;
  repeated CredentialInfo others = 3;
}

message ListCredentialsResponse {
  common.BaseResponse base = 1;
  repeated CredentialInfo data = 2;
}

message CredentialResponse {
  common.BaseResponse base = 1;
  CredentialInfo data = 2;
}

message GetCredentialUsagesRequest {
  uint64 id = 1 [(api.path) = "id"];
}

service CredentialService {
  rpc List(ListCredentialsRequest) returns (ListCredentialsResponse) {
    option (api.get) = "/api/v1/credentials/";
  }
  rpc Create(CreateCredentialRequest) returns (CredentialResponse) {
    option (api.post) = "/api/v1/credentials/";
  }
  rpc Match(MatchCredentialRequest) returns (MatchCredentialResponse) {
    option (api.post) = "/api/v1/credentials/match";
  }
  rpc Get(GetCredentialRequest) returns (CredentialResponse) {
    option (api.get) = "/api/v1/credentials/:id";
  }
  rpc Update(UpdateCredentialRequest) returns (CredentialResponse) {
    option (api.put) = "/api/v1/credentials/:id";
  }
  rpc Delete(DeleteCredentialRequest) returns (common.EmptyResponse) {
    option (api.delete) = "/api/v1/credentials/:id";
  }
  rpc Test(TestCredentialRequest) returns (TestCredentialResponse) {
    option (api.post) = "/api/v1/credentials/:id/test";
  }
  rpc GetUsages(GetCredentialUsagesRequest) returns (GetCredentialUsagesResponse) {
    option (api.get) = "/api/v1/credentials/:id/usages";
  }
  rpc Rotate(RotateCredentialRequest) returns (common.EmptyResponse) {
    option (api.post) = "/api/v1/credentials/:id/rotate";
  }
}
