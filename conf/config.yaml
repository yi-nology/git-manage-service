# Git Manage Service Configuration

# 1. Server Configuration
server:
  # Service listening port
  # Default: 12345
  port: 12345
  # External URL for webhook callbacks (required for webhook registration)
  # Example: http://your-server:12345 or https://git-mgmt.example.com
  external_url: "http://localhost:12345"

# 2. Database Configuration
database:
  # Database Type: sqlite, mysql, postgres
  # Default: sqlite
  type: sqlite
  
  # SQLite Configuration
  # Path to the database file. Recommend using absolute path or path relative to working directory.
  path: data/git_sync.db
  
  # MySQL / PostgreSQL Configuration
  # Uncomment and configure if using remote database
  # host: localhost
  # port: 3306 # 5432 for postgres
  # user: root
  # password: password # It is recommended to use environment variables in production
  # dbname: git_manage
  
  # Advanced: Custom DSN (Data Source Name)
  # If provided, it overrides host/port/user/pass/dbname settings.
  # dsn: "user:pass@tcp(127.0.0.1:3306)/dbname?charset=utf8mb4&parseTime=True&loc=Local"

# 3. Webhook Configuration
webhook:
  # Secret key for validating webhook signatures
  # SECURITY WARNING: Change this in production!
  secret: "my-secret-key"
  
  # Rate limit (requests per minute)
  rate_limit: 100
  
  # IP Whitelist for webhook endpoints
  # Leave empty to allow all IPs
  ip_whitelist: []
  # - "127.0.0.1"
  # - "192.168.1.100"

# 4. Debug Mode
# Enable for verbose logging
debug: false

# 5. RPC Configuration
rpc:
  # RPC service listening port
  # Default: 8888
  port: 8888

# 6. Lint Configuration
lint:
  enable_rpmlint: true

# 7. Code Review Configuration
code_review:
  enabled: false
  default_llm: "qwen"
  max_files: 50
  max_diff_lines: 3000
  auto_review_on_mr: true
  block_on_high: true
  llm_providers: []
  # - name: "qwen"
  #   type: "openai_compatible"
  #   base_url: "http://llm-gateway.internal/v1"
  #   api_key: ""
  #   model: "qwen2.5-coder"
  #   max_tokens: 4096
  # - name: "ollama"
  #   type: "ollama"
  #   base_url: "http://localhost:11434"
  #   model: "qwen2.5-coder:7b"
  #   max_tokens: 4096

# 8. Redis Configuration (for Asynq task queue)
redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# 9. Prometheus Configuration
prometheus:
  # Enable Prometheus metrics export
  # Default: false
  enabled: false
  # Prometheus metrics server port (separate from main HTTP server)
  # Default: 9091
  port: 9091
  # Metrics endpoint path
  # Default: /metrics
  path: "/metrics"

# 10. Mirror Configuration
mirror:
  # Git backend: "native" (git CLI) or "gogit" (pure Go)
  git_backend: "native"
  # Queue backend: "memory" or "redis"
  queue_backend: "memory"
  # Maximum concurrent sync workers
  max_workers: 5
  # Scheduler scan interval in seconds
  scan_interval: 30
  # Maximum retry attempts before pausing mirror
  max_retry: 5
  # Sync log retention in days
  log_retention_days: 30
  # Default sync interval in seconds for new mirrors
  default_sync_interval: 600
